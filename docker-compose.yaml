services:
  postgres:
    image: postgres:16-alpine
    container_name: fduel_postgres
    restart: unless-stopped
    networks: 
      - fduel
    environment:
      POSTGRES_DB: ${FDUEL_POSTGRES_DB}
      POSTGRES_USER: ${FDUEL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FDUEL_POSTGRES_PASSWORD}
    env_file:
      .env
    ports:
      - "5432:5432"
    volumes:
      - ./backend/.data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fduel_redis
    restart: unless-stopped
    networks:
      - fduel
    ports:
      - "6379:6379"
    volumes:
      - ./backend/.redis:/data

networks:
  fduel:
    driver: bridge
