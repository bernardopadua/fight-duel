name: Fight-Duel-Backend-Deploy

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          FDUEL_POSTGRES_DB: test_db
          FDUEL_POSTGRES_USER: test
          FDUEL_POSTGRES_PASSWORD: test
          FDUEL_POSTGRES_HOST: localhost
          FDUEL_POSTGRES_PORT: 5432

          FDUEL_REDIS_HOST: redis://localhost:6379

          DEBUG: False

          DJANGO_SECRET_KEY: 'DJANGO-SECRET-KEY-123-!'
          DJANGO_ALLOWED_HOSTS: '*'

          CORS_ALLOWED_ORIGINS: '*'

          CELERY_BEAT_MMO_TICK: 30.0
          CELERY_BEAT_MMO_ORPHAN_ITEMS: 30.0
        run: python manage.py test

  build-and-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fight-duel-backend:latest